posegraph:
  ros__parameters:
    # IMX-5 TODO: Read the datasheet
    imu_parameters:
      g: 0.0
      acc_max: 0.0
      acc_noise_density: 0.0 #
      acc_bias_prior: 0.0
      acc_random_walk: 0.0 # [m/s^2/sqrt(Hz)]
      gyro_max: 0.0
      gyro_noise_density: 0.0 # [rad/s/sqrt(Hz)]
      gyro_bias_prior: 0.0 #[rad/s]
      gyro_random_walk: 0.0 # [rad/s^2/sqrt(Hz)]
