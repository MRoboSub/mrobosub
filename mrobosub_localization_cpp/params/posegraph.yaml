posegraph:
  ros__parameters:
    # IMX-5 TODO: Read the datasheet
    imu_parameters:
      g: 9.80665

      acc_max: 156.9                       # 16g = 16 * 9.80665
      acc_noise_density: 5.88e-4           # 60 ug/sqrt(hz) = 60e-6 * 9.80665 = [m/s^2/sqrt(Hz)]
      acc_bias_prior: 1e-4                 # from "in-run bias stability": < 1.5 deg/hr (is an upper bound)
      acc_random_walk: 2.67e-3             # 0.16/60 =  [m/s^2/sqrt(Hz)]

      gyro_max: 69.81                      # 4000 deg/sec * pi/180 = 
      gyro_noise_density: 8.73e-5          # 0.005 deg/s/sqrt(Hz) * pi/180 = [rad/s/sqrt(Hz)]
      gyro_bias_prior: 1e-5                # [rad/s]
      gyro_random_walk: 4.65e-5            # 0.002667 * pi/180 [rad/s^2/sqrt(Hz)]

      integration_covariance: 0.0001
      imu_rate: 1000.0
      T_BS:
        [
          1.0000, 0.0000, 0.0000, 0.0000,
          0.0000, 1.0000, 0.0000, 0.0000,
          0.0000, 0.0000, 1.0000, 0.0000,
          0.0000, 0.0000, 0.0000, 1.0000,
        ]
    imu_preintegration_parameters:
      gap_time: 1.0
    # What is the sonar?
    sonar_parameters: 
      T_SSo: # What is this parameter?
        [
          1.0000, 0.0000, 0.0000, 0.0000,
          0.0000, 1.0000, 0.0000, 0.0000,
          0.0000, 0.0000, 1.0000, 0.0000,
          0.0000, 0.0000, 0.0000, 1.0000,
        ]
    dvl_parameters:
      T_SD: # Transformation from Sensor to Drone/Body (measure this!!!)
        [
          1.0000, 0.0000, 0.0000, 0.0000,
          0.0000, 1.0000, 0.0000, 0.0000,
          0.0000, 0.0000, 1.0000, 0.0000,
          0.0000, 0.0000, 0.0000, 1.0000,
        ]
      T_W_WD: # Transformation from Water-Frame to World/Map (can be kept as I)
        [
          1.0000, 0.0000, 0.0000, 0.0000,
          0.0000, 1.0000, 0.0000, 0.0000,
          0.0000, 0.0000, 1.0000, 0.0000,
          0.0000, 0.0000, 0.0000, 1.0000,
        ]
      prior_bias: 0.0
      fom_threshold: 0.05
    barometer_parameters:
      T_SBa: # Transformation from Sensor to Barometer. Z translation is important here.
        [
          1.0000, 0.0000, 0.0000, 0.0000,
          0.0000, 1.0000, 0.0000, 0.0000,
          0.0000, 0.0000, 1.0000, 0.0000,
          0.0000, 0.0000, 0.0000, 1.0000,
        ]
      atmospheric_pressure: 993.3999633789062 # fine.
    optimization_parameters:
      lambda_upper_bound: 1e10
      lambda_lower_bound: 1e-10
      lambda_initial: 1e-5
      max_iterations: 500
      relative_error_tolerance: 1e-4
      absolute_error_tolerance: 1e-4
    sensor_topics:
      imu_topic: "/imu"
      dvl_topic: "/dvl/twist"
      dvl_local_position_topic: "/dvl/local"
      barometer_topic: "/depth"
      sonar_topic: "/unused"
      # left_cam_topic:
      # right_cam_topic:
    sensor_usage:
      is_dvl_used: true
      is_imu_used: true
      is_barometer_used: true
      is_sonar_used: false
      are_cams_used: false
    using_orbslam: false
    num_iters: 1000
    using_smoother: true
    keyframe_gap_time: 1.0
    using_pseudo_dvl: true

