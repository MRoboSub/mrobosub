version: "3"
services:
  mrobosub_ros1:
    #image: mrobosub/mrobosub
    image: mrobosub/mrobosub1:latest
    build: .
    privileged: true
    ports:
      - "10001:10000" # muskaan: edited this so it wouldn't conflict with the ros2 ports
      - "1819-1820:1817-1818" # muskaan: edited this so it wouldn't conflict with the ros2 ports
    volumes:
      - .:/root/catkin_ws/src/mrobosub
      - /tmp/.X11-unix:/tmp/.X11-unix
    environment:
      - DISPLAY=host.docker.internal:0.0
      - LIBGL_ALWAYS_INDIRECT=0
      - QT_X11_NO_MITSHM=1
    tty: true
    stdin_open: true
