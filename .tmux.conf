set -g default-shell /bin/bash

# allow reload of this file with PRE r
bind r source-file ~/.tmux.conf \; display "Reloaded."

set -g prefix C-b
bind C-b send-prefix

# -r repeat time (Default 500 millis)
set -g repeat-time 2000

# colors
set -g default-terminal "screen-256color"

# mouse mode (scrolling, etc)
# tmux 2.1
setw -g mouse on

# tmux < 2.1
# setw -g mode-mouse on
# # set -g mouse-select-pane on
# set -g mouse-resize-pane on
# set -g mouse-select-window on

# remove delay
set -sg escape-time 1

# set {window,pane} index to start at 1
# set -g base-index 1
# setw -g pane-base-index 1

# remap split panes
# bind | split-window -h
# bind - split-window -v

# vim style through panes
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# vim style through windows (PRE Control-H/L)
bind -r C-h select-window -t :-
bind -r C-l select-window -t :+

# vim style through resizing
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5


# split window into four sections
bind -r f split-window -h \; split-window -v \; select-pane -L \; split-window -v \; select-pane -U
bind -r q kill-session


# vim style movement (PRE [ then hjkl)
# set-window-option mode-keys vi

# Increase History Size
set-option -g history-limit 5000

# When creating a new window, create it relative to the current path, not path
# that tmux was started on
bind c new-window -c "#{pane_current_path}"

# Start counting pane and window number at 1 because of Keyboard lagyout
set -g base-index 1
setw -g pane-base-index 1

# If a window is deleted, it is renumbered instead of retaining the old number
set -g renumber-windows on

