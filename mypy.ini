# Global options:

[mypy]
ignore_missing_imports = True
disallow_untyped_defs = True
packages = mrobosub_bringup,
    mrobosub_fcu,
    mrobosub_gnc,
    mrobosub_hal,
    mrobosub_lib,
    mrobosub_localization,
    mrobosub_monitoring,
    mrobosub_perception,
    mrobosub_planning,
    mrobosub_sim,
    mrobosub_teleop,
    mrobosub_tests
exclude = (?x)(^setup\.py$|^launch$|/launch/)

# Per-module options:

[mypy-mrobosub_msgs.*]
ignore_missing_imports = True

[mypy-std_msgs.*]
ignore_missing_imports = True

[mypy-rospy]
ignore_missing_imports = True

[mypy-std_srvs.*]
ignore_missing_imports = True

[mypy-non_idealistic_states.*]
ignore_missing_imports = True
