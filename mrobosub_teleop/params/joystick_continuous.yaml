

deadzone: 0.1

# 0,1=left stick 2,3=right stick 4,5=triggers - i think; not too sure about these
surge: { axis: 1, scale: 0.5 }
sway: { axis: 0, scale: 0.5 }
heave: { axis: 4, scale: 0.5 }
yaw: { axis: 3, scale: 0.5 }
roll: { axis: 5, scale: 0.5 }
pitch: { axis: 2, scale: 0.5 }

# Button actions (button index -> action)
# Supported actions: estop (hold to zero all outputs)
buttons:
  "4": { use: estop }
