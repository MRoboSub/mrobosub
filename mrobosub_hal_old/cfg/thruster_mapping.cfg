#!/usr/bin/env python

PACKAGE = "mrobosub_hal"

from dynamic_reconfigure.parameter_generator_catkin import *

gen = ParameterGenerator()

default_mapping = [6, 3, 5, 0, 7, 1, 4, 2]
default_reverses = [True, True, True, True, False, False, True, True]
for i in range(8):
    gen.add(f"motor{i}", int_t, 0, f"motor {i} in logic maps to this motor on hardware", default_mapping[i], 0, 12)
    gen.add(f"motor{i}_rev", bool_t, 0, f"motor {i} in logic has a reversed propeller", default_reverses[i])

exit(gen.generate(PACKAGE, "thruster_controller", "thruster_mapping"))
